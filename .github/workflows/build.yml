name: Build The GOD MENU

on:
  workflow_dispatch:
  push:
    branches:
      - the-god-menu-build
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build both editions and source archive
        run: gradle --no-daemon clean build sourceZip --stacktrace
      - name: List outputs
        run: |
          ls -lah build/libs
          ls -lah build/distributions
      - uses: actions/upload-artifact@v4
        with:
          name: the-god-menu-release
          path: |
            build/libs/The-God-menu-Free-1.21.11.jar
            build/libs/The-God-menu-Premium-1.21.11.jar
            build/distributions/TheGodMenu-Source.zip
          if-no-files-found: error
          retention-days: 30
