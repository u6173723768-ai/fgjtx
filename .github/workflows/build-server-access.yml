name: Build Server Access Mod
on:
  push:
    branches: [server-access-allowlist]
    paths:
      - "ServerAccess/**"
      - ".github/workflows/build-server-access.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"
      - name: Build Fabric mod
        working-directory: ServerAccess
        run: gradle --no-daemon clean build --stacktrace
      - name: Verify jar
        run: |
          test -f ServerAccess/build/libs/server-access-1.0.1.jar
          jar tf ServerAccess/build/libs/server-access-1.0.1.jar | grep -E 'fabric.mod.json|serveraccess.accesswidener|dev/serveraccess/AccessControlMod.class|dev/serveraccess/AllowedPlayersState.class'
      - uses: actions/upload-artifact@v4
        with:
          name: server-access-fabric-1.21.11
          path: ServerAccess/build/libs/server-access-1.0.1.jar
          if-no-files-found: error
          retention-days: 14
